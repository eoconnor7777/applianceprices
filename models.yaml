currency: EUR

# ---------------------------------------------------------------------------
# PRODUCTS = the exact variants you want to track.
#   model        : drop in the precise SKU when you have it -> most accurate
#                  match (a model-number hit scores highest). Leave "" to match
#                  on name + must_include only.
#   must_include : HARD filter that pins the variant. Each entry is a string
#                  (must appear in the listing title) OR a list (any-of).
#                  This is how we force "black" and "integrated" etc.
#   prefer       : soft signals that raise the score but aren't required.
# Confirm the model numbers marked TODO against the retailer/Bosch site.
# ---------------------------------------------------------------------------
products:
  - key: oven_bosch_s8_single
    name: Bosch Series 8 HBG7741B1B built-in single oven
    brand: Bosch
    model: "HBG7741B1B"
    must_include: [[oven]]
    prefer: ["series 8", single, "built in", "built-in", pyrolytic]
    exclude: [microwave, combi, compact, "air fry"]

  - key: combioven_bosch_s8_micro
    name: Bosch Series 8 CMG7241B1B compact oven with microwave
    brand: Bosch
    model: "CMG7241B1B"
    must_include: [[microwave, combi, compact]]
    prefer: ["series 8", oven, microwave, compact, 45cm]

  - key: dishwasher_bosch_s6_int
    name: Bosch Series 6 SMV6ZCX10G 60cm fully integrated dishwasher
    brand: Bosch
    model: "SMV6ZCX10G"
    must_include: [[integrated], dishwasher]
    prefer: ["series 6", "fully integrated", 60cm]

  - key: washer_bosch_s6
    name: Bosch Series 6 WGG244ZCGB 9kg washing machine
    brand: Bosch
    model: "WGG244ZCGB"
    must_include: ["washing machine"]
    prefer: ["series 6", 9kg, freestanding, 1400]
    exclude: [integrated, "washer dryer", dishwasher]

  - key: dryer_bosch_s6_hp
    name: Bosch Series 6 WQG245R1GB 9kg heat pump tumble dryer
    brand: Bosch
    model: "WQG245R1GB"
    must_include: [[dryer, tumble]]
    prefer: ["series 6", "heat pump", 9kg, freestanding]
    exclude: [integrated, "washer dryer", washing]

# ---------------------------------------------------------------------------
# RETAILERS = where to look. {query} is URL-encoded automatically.
# strategy: jsonld | text | auto. Tweak per site if extraction comes back empty
# (run `track`, look at the "N candidates" counts, then switch strategy).
# Search-URL patterns below were observed working in mid-2026; verify if a site
# is redesigned. Add more retailers freely.
# ---------------------------------------------------------------------------
retailers:
  - key: powercity
    name: Power City
    search_url: "https://www.powercity.ie/groups/groups/search?search={query}"
    strategy: text

  - key: did
    name: DID Electrical
    # Bot-protected: a long-lived shared browser gets empty results after the
    # first hit, so use a fresh browser process per page (see fresh_browser).
    search_url: "https://www.did.ie/search?q={query}"
    strategy: auto
    fresh_browser: true

  - key: harveynorman
    name: Harvey Norman
    # DISABLED: behind Imperva Incapsula (incap_ses_* cookie + JS challenge).
    # A fresh stealth browser + homepage warmup did NOT pass the challenge from
    # CI's datacenter IP (0/7, repeatedly). Beating it needs a residential proxy
    # or a paid scraping API. Config kept so it can be re-enabled if one's added:
    # flip enabled back to true.
    enabled: false
    search_url: "https://www.harveynorman.ie/index.php?dispatch=products.search&q={query}"
    strategy: auto
    fresh_browser: true
    warmup_url: "https://www.harveynorman.ie/"
    stealth: true

  - key: currys
    name: Currys IE
    # Bot-protected: plain HTTP from a datacenter IP gets 403 (Python TLS
    # fingerprint), and a shared browser gets intermittent challenges. Use a
    # fresh browser process per page (best coverage). An exact-SKU search 301s
    # to the product page, whose clean JSON-LD we parse (the text scraper hit a
    # €500 finance-price false match here). Oven/hob load via Currys' SFCC
    # search API (JS) and stay unmatched.
    search_url: "https://www.currys.ie/search?q={query}"
    strategy: jsonld
    fresh_browser: true

  - key: buyitdirect
    name: Buy It Direct
    # No stable results-page template; the autocomplete JSON API is the robust
    # integration point. Parsed by the dedicated `buyitdirect` strategy.
    search_url: "https://www.buyitdirect.ie/Search/Autocomplete?term={query}"
    strategy: buyitdirect

  - key: euronics
    name: Euronics IE
    # Shopify storefront: the standard /search?q= returns a clean product grid
    # with embedded Product JSON-LD. Stable (no bot wall observed), so it rides
    # the shared browser. Note: a missing exact SKU falls back to the nearest
    # variant, so the matched title may be a sibling model - check it in-report.
    search_url: "https://euronics.ie/search?q={query}"
    strategy: auto

  - key: soundstore
    name: Soundstore
    # Magento catalogsearch; the results grid is JS-rendered (a plain GET shows
    # only the filter rail), so Playwright populates it. auto = JSON-LD first,
    # then text scrape.
    search_url: "https://www.soundstore.ie/catalogsearch/result/?q={query}"
    strategy: auto

# ---------------------------------------------------------------------------
# DISCOUNTS used by `analyze` to estimate single-retailer bundle totals.
# Set these from each retailer's stated terms. Multibuy maps item-count to a
# fractional discount; bosch_bundle_flat is a flat € off a qualifying order.
# (Defaults are 0 so totals stay honest until you fill in real terms.)
# ---------------------------------------------------------------------------
discounts:
  bosch_bundle_flat: 250        # Power City "Bosch Kitchen Bundle up to €250"
  bosch_bundle_min_items: 3
  multibuy:
    2: 0.0
    3: 0.0
